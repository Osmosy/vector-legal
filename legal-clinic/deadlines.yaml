# Реестр сроков клиники — legal-clinic
#
# Наполняется /deadlines --add (или извлечением из /client-intake, /draft,
# /status, когда эти навыки показывают срок). Читается /deadlines --report
# для кросс-дела.
#
# Пропущенный срок в клинической работе — ответственность супервизора.
# Этот файл — операционный документ: полнота и актуальность критичны.
#
# ──────────────────────────────────────────────────────────────────────────
# Схема
# ──────────────────────────────────────────────────────────────────────────
# - id:             строка (slug: [case]-[кратко]-[YYYY-MM])
#   case_id:        строка — ссылка на дело/клиента в учёте клиники
#   case_name:      строка — читаемое имя дела
#   practice_area:  жилищные | семейные | потребительские | миграционные | трудовые | соцобеспечение | иное
#   type:           filing | hearing | statute-of-limitations | discovery | cure-period | response | notice | other
#   description:    строка — однострочно, что должно быть сделано
#   due_date:       YYYY-MM-DD | "[ПОДТВЕРДИТЬ]" (пока студент не посчитал по норме)
#   time:           HH:MM (опционально; для заседаний и cutoff)
#   timezone:       строка (опционально; дефолт из юрисдикции профиля)
#   source:         строка — откуда срок (повестка от 2026-08-20, ст. 321 ГПК,
#                   ст. 392 ТК, претензионный порядок по ЗоЗПП)
#   owner_student:  строка — ответственный студент
#   owner_supervisor: строка — супервизор, подтверждающий расчёт (из профиля)
#   status:         upcoming | today | overdue | completed | closed
#   completed_date: YYYY-MM-DD | null
#   notes:          строка | null
#   created:        YYYY-MM-DD
#   created_by:     строка — студент, внесший запись
# ──────────────────────────────────────────────────────────────────────────

deadlines: []